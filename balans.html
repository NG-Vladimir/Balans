<!DOCTYPE html>

    <style>

    </style>
</head>

                    <div class="logo-title">

    <main>

        </div>

        <div class="stats">

    class="modal"

    <div class="modal-box">

                </label>

                >

                        Выберите размер
                    </option>

                    </option>

<script>

    /*
    ==========================================
    УЧЁТ ШИН — ЭТАП 1
    ==========================================

    Пока данные хранятся в localStorage.

    На следующем этапе этот слой данных
    можно заменить на Google Sheets,
    практически не меняя интерфейс.
    */


    const STORAGE_KEY = "tire_inventory_operations";


    let currentOperationType = "in";


    /*
    ------------------------------------------
    Получение операций
    ------------------------------------------
    */

    function getOperations() {

        const data = localStorage.getItem(STORAGE_KEY);

        if (!data) {
            return [];
        }

        try {

            return JSON.parse(data);

        } catch (error) {

            console.error(
                "Ошибка чтения данных:",
                error
            );

            return [];
        }
    }


    /*
    ------------------------------------------
    Сохранение операций
    ------------------------------------------
    */

    function saveOperations(operations) {

        localStorage.setItem(
            STORAGE_KEY,
            JSON.stringify(operations)
        );

    }


    /*
    ------------------------------------------
    Открытие окна
    ------------------------------------------
    */

    function openModal(type) {

        currentOperationType = type;

        const modal =
            document.getElementById("operationModal");

        const title =
            document.getElementById("modalTitle");

        if (type === "in") {

            title.textContent =
                "Приход шин";

        } else {

            title.textContent =
                "Выдача шин";

        }


        const dateInput =
            document.getElementById("date");

        dateInput.value =
            new Date()
                .toISOString()
                .split("T")[0];


        document
            .getElementById("operationForm")
            .reset();


        dateInput.value =
            new Date()
                .toISOString()
                .split("T")[0];


        modal.classList.add("active");

    }


    /*
    ------------------------------------------
    Закрытие окна
    ------------------------------------------
    */

    function closeModal() {

        document
            .getElementById("operationModal")
            .classList.remove("active");

    }


    /*
    ------------------------------------------
    Добавление операции
    ------------------------------------------
    */

    document
        .getElementById("operationForm")
        .addEventListener(
            "submit",
            function(event) {

                event.preventDefault();


                const date =
                    document.getElementById("date").value;


                const organization =
                    document
                        .getElementById("organization")
                        .value
                        .trim();


                const size =
                    document.getElementById("size").value;


                const quantity =
                    Number(
                        document
                            .getElementById("quantity")
                            .value
                    );


                const comment =
                    document
                        .getElementById("comment")
                        .value
                        .trim();


                if (
                    !date ||
                    !organization ||
                    !size ||
                    !quantity ||
                    quantity <= 0
                ) {

                    alert(
                        "Заполните все обязательные поля."
                    );

                    return;
                }


                /*
                Проверяем расход.

                Нельзя выдать больше,
                чем есть на складе.
                */

                if (
                    currentOperationType === "out"
                ) {

                    const balance =
                        getSizeBalance(size);

                    if (quantity > balance) {

                        alert(
                            `Недостаточно шин.\n\n` +
                            `Размер: ${size}\n` +
                            `Доступно: ${balance} шт.`
                        );

                        return;
                    }

                }


                const operations =
                    getOperations();


                const operation = {

                    id:
                        Date.now(),

                    date,

                    type:
                        currentOperationType,

                    organization,

                    size,

                    quantity,

                    comment,

                    createdAt:
                        new Date().toISOString()

                };


                operations.push(operation);


                saveOperations(operations);


                closeModal();


                renderAll();

            }
        );


    /*
    ------------------------------------------
    Баланс конкретного размера
    ------------------------------------------
    */

    function getSizeBalance(size) {

        const operations =
            getOperations();


        let balance = 0;


        operations.forEach(operation => {

            if (operation.size !== size) {
                return;
            }


            if (operation.type === "in") {

                balance +=
                    Number(operation.quantity);

            } else {

                balance -=
                    Number(operation.quantity);

            }

        });


        return balance;

    }


    /*
    ------------------------------------------
    Общая статистика
    ------------------------------------------
    */

    function calculateStatistics() {

        const operations =
            getOperations();


        let totalIn = 0;

        let totalOut = 0;


        operations.forEach(operation => {

            if (operation.type === "in") {

                totalIn +=
                    Number(operation.quantity);

            } else {

                totalOut +=
                    Number(operation.quantity);

            }

        });


        return {

            totalIn,

            totalOut,

            balance:
                totalIn - totalOut,

            count:
                operations.length

        };

    }


    /*
    ------------------------------------------
    Обновление карточек
    ------------------------------------------
    */

    function renderStatistics() {

        const stats =
            calculateStatistics();


        document
            .getElementById("totalBalance")
            .textContent =
            stats.balance;


        document
            .getElementById("totalIn")
            .textContent =
            stats.totalIn;


        document
            .getElementById("totalOut")
            .textContent =
            stats.totalOut;


        document
            .getElementById("operationsCount")
            .textContent =
            stats.count;

    }


    /*
    ------------------------------------------
    Баланс по размерам
    ------------------------------------------
    */

    function renderBalance() {

        const operations =
            getOperations();


        const sizes =
            [
                "315/70 R22.5",
                "315/60 R22.5",
                "385/65 R22.5",
                "385/55 R22.5",
                "385/65 R19.5"
            ];


        const balances = {};


        sizes.forEach(size => {

            balances[size] =
                getSizeBalance(size);

        });


        const usedSizes =
            [...new Set(
                operations.map(
                    operation => operation.size
                )
            )];


        usedSizes.forEach(size => {

            if (
                !balances.hasOwnProperty(size)
            ) {

                balances[size] =
                    getSizeBalance(size);

            }

        });


        const rows =
            Object.entries(balances)
                .filter(
                    ([size, balance]) =>
                        balance !== 0 ||
                        operations.some(
                            operation =>
                                operation.size === size
                        )
                );


        const container =
            document.getElementById(
                "balanceTable"
            );


        if (!rows.length) {

            container.innerHTML = `

                <div class="empty">

                    <div class="empty-icon">
                        🛞
                    </div>

                    Пока нет данных

                </div>

            `;

            return;

        }


        let html = `

            <table>

                <thead>

                    <tr>

                        <th>Размер</th>

                        <th>Остаток</th>

                    </tr>

                </thead>

                <tbody>

        `;


        rows.forEach(
            ([size, balance]) => {

                html += `

                    <tr>

                        <td>
                            <strong>
                                ${escapeHtml(size)}
                            </strong>
                        </td>

                        <td>
                            <strong>
                                ${balance} шт.
                            </strong>
                        </td>

                    </tr>

                `;

            }
        );


        html += `

                </tbody>

            </table>

        `;


        container.innerHTML =
            html;

    }


    /*
    ------------------------------------------
    История операций
    ------------------------------------------
    */

    function renderOperations() {

        const operations =
            getOperations()
                .sort(
                    (a,b) =>
                        new Date(b.createdAt) -
                        new Date(a.createdAt)
                );


        const container =
            document.getElementById(
                "operationsTable"
            );


        if (!operations.length) {

            container.innerHTML = `

                <div class="empty">

                    <div class="empty-icon">
                        📋
                    </div>

                    Операций пока нет

                </div>

            `;

            return;

        }


        let html = `

            <table>

                <thead>

                    <tr>

                        <th>Дата</th>

                        <th>Операция</th>

                        <th>Организация</th>

                        <th>Размер</th>

                        <th>Количество</th>

                        <th></th>

                    </tr>

                </thead>

                <tbody>

        `;


        operations.forEach(
            operation => {

                const isIn =
                    operation.type === "in";


                html += `

                    <tr>

                        <td>
                            ${formatDate(operation.date)}
                        </td>

                        <td>

                            <span class="badge ${
                                isIn
                                    ? "badge-in"
                                    : "badge-out"
                            }">

                                ${
                                    isIn
                                        ? "ПРИХОД"
                                        : "РАСХОД"
                                }

                            </span>

                        </td>

                        <td>
                            ${escapeHtml(
                                operation.organization
                            )}
                        </td>

                        <td>
                            ${escapeHtml(
                                operation.size
                            )}
                        </td>

                        <td>

                            <span class="${
                                isIn
                                    ? "quantity-in"
                                    : "quantity-out"
                            }">

                                ${
                                    isIn
                                        ? "+"
                                        : "-"
                                }${operation.quantity}

                            </span>

                        </td>

                        <td>

                            <button
                                class="delete-btn"
                                onclick="deleteOperation(${operation.id})"
                                title="Удалить"
                            >
                                ×
                            </button>

                        </td>

                    </tr>

                `;

            }
        );


        html += `

                </tbody>

            </table>

        `;


        container.innerHTML =
            html;

    }


    /*
    ------------------------------------------
    Удаление операции
    ------------------------------------------
    */

    function deleteOperation(id) {

        const operations =
            getOperations();


        const operation =
            operations.find(
                item =>
                    item.id === id
            );


        if (!operation) {
            return;
        }


        const confirmed =
            confirm(
                "Удалить эту операцию?"
            );


        if (!confirmed) {
            return;
        }


        const filtered =
            operations.filter(
                item =>
                    item.id !== id
            );


        saveOperations(filtered);


        renderAll();

    }


    /*
    ------------------------------------------
    Формат даты
    ------------------------------------------
    */

    function formatDate(date) {

        if (!date) {
            return "";
        }


        const parts =
            date.split("-");


        if (parts.length !== 3) {
            return date;
        }


        return (
            parts[2] +
            "." +
            parts[1] +
            "." +
            parts[0]
        );

    }


    /*
    ------------------------------------------
    Защита HTML
    ------------------------------------------
    */

    function escapeHtml(value) {

        return String(value)
            .replaceAll("&", "&amp;")
            .replaceAll("<", "&lt;")
            .replaceAll(">", "&gt;")
            .replaceAll('"', "&quot;")
            .replaceAll("'", "&#039;");

    }


    /*
    ------------------------------------------
    Обновить всё
    ------------------------------------------
    */

    function renderAll() {

        renderStatistics();

        renderBalance();

        renderOperations();

    }


    /*
    ------------------------------------------
    Закрытие modal по клику снаружи
    ------------------------------------------
    */

    document
        .getElementById("operationModal")
        .addEventListener(
            "click",
            function(event) {

                if (
                    event.target === this
                ) {

                    closeModal();

                }

            }
        );


    /*
    ------------------------------------------
    ЗАПУСК
    ------------------------------------------
    */

    renderAll();

</script>
